org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kept small so a build, the emulator and a browser fit in 16 GB together (the Kotlin daemon
# otherwise inherits the Gradle heap; at 4g each they pushed the Ubuntu box out of memory).
kotlin.daemon.jvmargs=-Xmx1g
